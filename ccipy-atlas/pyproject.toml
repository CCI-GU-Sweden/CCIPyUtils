[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ccipy-atlas"
version = "0.1.0"
description = "Utilities under the ccipy namespace"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "You"}]
license = {text = "MIT"}
dependencies = ["pyside6", "ccipy.utils"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ccipy.atlas"]
namespaces = true

# ---------------------------------
# Ruff configuration inside pyproject
# ---------------------------------
[tool.ruff]
fix = false #disable autofix
line-length = 120
target-version = "py312"

exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "env",
]

# --- Linting (PEP8, pyflakes, naming, etc.) ---
[tool.ruff.lint]
select = ["E", "W", "F", "N"]
ignore = ["E501"]             # ignore long-line rule
preview = true               # optional


# --- Format section (Ruff formatter) ---
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
